            justify-content: space-between;
            align-items: center;
            z-index: 10;

            border-radius: 12px;
            border: 1px solid #DDD;
            background: white;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        .card-container {
            width: 340px;
            height: 480px;
            perspective: 1000px;
        }

        .card {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 30px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 45px;
            text-align: center;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-top: 15px solid var(--accent-red);
        }

        .category-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #AAA;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .question-text {
            font-family: 'Libre Baskerville', serif;
            font-size: 1.6rem;
            line-height: 1.5;
            color: var(--text-dark);
        }

        .card-footer {
            position: absolute;
            bottom: 30px;
            font-size: 0.75rem;
            color: #DDD;
            font-weight: 600;
        }

        .controls {
            margin-top: 40px;
            display: flex;
            gap: 20px;
        }

        .btn {
            background: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .btn-main {
            width: auto;
            padding: 0 35px;
            border-radius: 50px;
            background: var(--text-dark);
            color: white;
            font-weight: 600;
            font-size: 1rem;
        }

        .btn:active { transform: scale(0.92); }

        .status {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #CCC;
            font-weight: 600;
        }

        /* Farve-temaer */
        .theme-red { border-top-color: var(--accent-red); }
        .theme-blue { border-top-color: var(--accent-blue); }
        .theme-green { border-top-color: var(--accent-green); }

        let pool = [...allQuestions];
        let currentIdx = -1;
        let seen = [];

        function updateCard() {
            const q = pool[currentIdx];
            const card = document.getElementById('card');
            card.style.opacity = 0;
            card.style.transform = "translateY(10px)";
            
            setTimeout(() => {
                document.getElementById('displayCat').innerText = q.cat;
                document.getElementById('displayText').innerText = q.text;
                document.getElementById('displayID').innerText = "#" + q.id;
                card.className = "card " + q.theme;
                card.style.opacity = 1;
                card.style.transform = "translateY(0)";
                document.getElementById('status').innerText = `Kort ${currentIdx + 1} af ${pool.length}`;
            }, 200);
        }

        function shuffle() {
            if (seen.length === pool.length) seen = [];
            let r;
            do { r = Math.floor(Math.random() * pool.length); } 
            while (seen.includes(r) && pool.length > 1);
            seen.push(r);
            currentIdx = r;
            updateCard();
        }

        function next() {
            currentIdx = (currentIdx + 1) % pool.length;
            updateCard();
        }

        function prev() {
            currentIdx = (currentIdx - 1 + pool.length) % pool.length;
            updateCard();
        }

        function resetAndFilter() {
            const val = document.getElementById('catFilter').value;
            pool = val === 'all' ? [...allQuestions] : allQuestions.filter(q => q.cat === val);
            currentIdx = -1;
            seen = [];
            document.getElementById('displayText').innerText = "Bunken er klar. Træk et kort.";
            document.getElementById('status').innerText = `Kort 0 af ${pool.length}`;
        }

        document.getElementById('status').innerText = `Kort 0 af ${allQuestions.length}`;
