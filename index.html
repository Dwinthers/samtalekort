<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FamilieFokus">
<meta name="theme-color" content="#0f0d0a">
<title>FamilieFokus - Samtalekort</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0d0a;
    --surface: #1c1812;
    --gold: #c9963a;
    --gold-light: #e8b85a;
    --cream: #f5ede0;
    --cream-dim: #d9c9b4;
  }
  body {
    background: var(--bg);
    color: var(--cream);
    font-family: 'Lora', serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 60px 20px 20px;
    text-align: center;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    letter-spacing: 0.2rem;
    text-transform: uppercase;
    color: var(--gold);
  }
  #scene {
    flex: 1;
    perspective: 1200px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card-container {
    width: 100%;
    max-width: 340px;
    height: 480px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }
  .card-container.is-flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    padding: 40px;
    border: 1px solid rgba(201, 150, 58, 0.3);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  .card-front { background: var(--surface); justify-content: center; align-items: center; }
  .card-back { background: var(--surface); transform: rotateY(180deg); justify-content: space-between; }
  
  .card-category { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 0.8rem; letter-spacing: 0.1rem; text-transform: uppercase; }
  .card-id { color: var(--gold); opacity: 0.5; font-size: 0.8rem; }
  .card-text { font-size: 1.6rem; line-height: 1.4; color: var(--cream); text-align: center; margin-top: 20px; }
  
  .controls {
    padding: 40px 20px;
    display: flex;
    justify-content: center;
    gap: 30px;
  }
  button {
    background: none;
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 12px 24px;
    border-radius: 30px;
    font-family: 'Lora', serif;
    text-transform: uppercase;
    letter-spacing: 0.1rem;
    font-size: 0.7rem;
    transition: all 0.3s;
  }
  button:active { background: var(--gold); color: var(--bg); }
</style>
</head>
<body>
  <header><h1>FamilieFokus</h1></header>
  <div id="scene">
    <div class="card-container" id="card" onclick="flipCard()">
      <div class="card-face card-front">
        <div class="card-category">Tryk for at se spørgsmål</div>
      </div>
      <div class="card-face card-back" id="cardBack">
        <div style="display:flex; justify-content: space-between; width: 100%;">
          <div class="card-category">TALK</div>
          <div class="card-id" id="cardNumber">#00</div>
        </div>
        <div class="card-text" id="questionText">Henter spørgsmål...</div>
        <div style="height: 20px;"></div>
      </div>
    </div>
  </div>
  <div class="controls">
    <button onclick="prevCard()">Forrige</button>
    <button onclick="nextCard()">Næste</button>
  </div>

  <script type="module">
    // 1. Hent spørgsmålene fra filen
    import questions from './questions.js';

    let currentIndex = 0;
    const cardElement = document.getElementById('card');
    const questionText = document.getElementById('questionText');
    const cardNumber = document.getElementById('cardNumber');

    function updateCard() {
      cardElement.classList.remove('is-flipped');
      setTimeout(() => {
        const q = questions[currentIndex];
        questionText.innerText = q.text;
        cardNumber.innerText = '#' + q.id;
      }, 150);
    }

    // 2. Vi gør funktionerne globale, så knapperne (onclick) kan finde dem
    window.flipCard = function() {
      cardElement.classList.toggle('is-flipped');
    }

    window.nextCard = function() {
      currentIndex = (currentIndex + 1) % questions.length;
      updateCard();
    }

    window.prevCard = function() {
      currentIndex = (currentIndex - 1 + questions.length) % questions.length;
      updateCard();
    }

    // 3. Start appen
    updateCard();
  </script>
</body>
</html>
