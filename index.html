<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FamilieFokus">
<meta name="theme-color" content="#0f0d0a">
<title>FamilieFokus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0d0a; 
    --card-bg: #f5ede0; 
    --gold: #c9963a; 
    --dark-text: #1c1812;
    --muted-text: #5e5445;
  }
  body {
    background: var(--bg); color: var(--card-bg); 
    font-family: 'Lora', serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header { padding: 60px 20px 10px; text-align: center; }
  h1 { 
    font-family: 'Playfair Display', serif; 
    font-weight: 600; font-size: 0.9rem; 
    letter-spacing: 0.4rem; text-transform: uppercase; 
    color: var(--gold); 
  }
  
  /* Dropdown styling */
  .filter-container {
    padding: 10px 20px;
    display: flex;
    justify-content: center;
  }
  select {
    background: transparent;
    border: 1px solid rgba(201, 150, 58, 0.4);
    color: var(--gold);
    padding: 8px 15px;
    border-radius: 10px;
    font-family: 'Lora', serif;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    outline: none;
    appearance: none; /* Fjerner standard pil i nogle browsere */
    text-align: center;
  }

  #scene { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
  
  .card { 
    width: 100%; max-width: 340px; height: 460px; 
    background: var(--card-bg); border-radius: 20px; 
    display: flex; flex-direction: column; 
    padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    position: relative;
  }
  
  .card-top-row {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; margin-bottom: 20px;
  }
  .card-category { 
    font-family: 'Playfair Display', serif; font-weight: 600; font-style: italic;
    color: var(--gold); font-size: 0.8rem; letter-spacing: 0.1rem; text-transform: uppercase; 
  }
  .card-id { font-family: 'Lora', serif; color: var(--muted-text); font-size: 0.8rem; opacity: 0.7; }
  .card-text { 
    font-family: 'Playfair Display', serif; font-size: 1.8rem; line-height: 1.3; 
    color: var(--dark-text); text-align: center; margin: auto 0; 
  }
  
  .fav-btn { 
    background: none; border: none; color: var(--gold); font-size: 1.8rem; 
    cursor: pointer; margin-top: 20px; align-self: center;
  }
  
  .bottom-controls { padding: 20px 20px 60px; display: flex; flex-direction: column; align-items: center; gap: 25px; }
  .nav-arrows { display: flex; align-items: center; gap: 40px; }
  .arrow { 
    background: none; border: 1px solid rgba(201, 150, 58, 0.3); color: var(--gold); 
    width: 55px; height: 55px; border-radius: 50%; font-size: 1.2rem; 
    display: flex; align-items: center; justify-content: center;
  }
  
  .tool-bar { display: flex; align-items: center; gap: 15px; }
  .tool-btn { 
    background: rgba(201, 150, 58, 0.05); border: 1px solid rgba(201, 150, 58, 0.2); 
    color: var(--gold); padding: 10px 18px; border-radius: 20px; 
    font-size: 0.65rem; font-family: 'Lora', serif; text-transform: uppercase; letter-spacing: 2px; 
  }

  /* Retur-ikon knap */
  .reset-btn {
    background: none; border: 1px solid rgba(201, 150, 58, 0.3); 
    color: var(--gold); width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
  }
</style>
</head>
<body>

<header><h1>FamilieFokus</h1></header>

<div class="filter-container">
  <select id="categorySelect" onchange="setFilter(this.value)">
    <option value="Alle">Alle kategorier</option>
    <option value="Refleksion">Refleksion</option>
    <option value="Drømme">Drømme</option>
    <option value="Relationer">Relationer</option>
    <option value="Hverdag">Hverdag</option>
  </select>
</div>

<div id="scene">
  <div class="card" id="cardArea">
    <div class="card-top-row">
      <div class="card-category" id="catLabel">Kategori</div>
      <div class="card-id" id="idLabel">#00</div>
    </div>
    <div class="card-text" id="qText">Henter spørgsmål...</div>
    <button class="fav-btn" onclick="toggleFav(event)" id="favIcon">♡</button>
  </div>
</div>

<div class="bottom-controls">
  <div class="nav-arrows">
    <button class="arrow" onclick="go(-1)">←</button>
    <button class="arrow" onclick="go(1)">→</button>
  </div>
  <div class="tool-bar">
    <button class="tool-btn" onclick="shuffleDeck()">Shuffle</button>
    <button class="reset-btn" onclick="resetDeck()" title="Nulstil">↺</button>
    <button class="tool-btn" onclick="showFavsOnly()" id="favToggleBtn">Favoritter</button>
  </div>
</div>

<script type="module">
  import questions from './questions.js';

  let deck = [...questions];
  let currentIndex = 0;
  let favorites = JSON.parse(localStorage.getItem('ff_favs')) || [];
  let currentFilter = 'Alle';
  let showingFavs = false;

  const qText = document.getElementById('qText');
  const catLabel = document.getElementById('catLabel');
  const idLabel = document.getElementById('idLabel');
  const favIcon = document.getElementById('favIcon');
  const categorySelect = document.getElementById('categorySelect');

  window.setFilter = (cat) => {
    currentFilter = cat;
    showingFavs = false;
    applyFilters();
  };

  function applyFilters() {
    let tempDeck = [...questions];
    if (currentFilter !== 'Alle') tempDeck = tempDeck.filter(q => q.cat === currentFilter);
    if (showingFavs) tempDeck = tempDeck.filter(q => favorites.includes(q.id));
    
    deck = tempDeck;
    currentIndex = 0;
    updateUI();
  }

  window.go = (dir) => {
    if (deck.length === 0) return;
    currentIndex = (currentIndex + dir + deck.length) % deck.length;
    updateUI();
  };

  window.shuffleDeck = () => {
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    currentIndex = 0;
    updateUI();
  };

  window.resetDeck = () => {
    currentFilter = 'Alle';
    categorySelect.value = 'Alle';
    showingFavs = false;
    document.getElementById('favToggleBtn').style.background = '';
    document.getElementById('favToggleBtn').style.color = '';
    applyFilters();
  };

  window.showFavsOnly = () => {
    showingFavs = !showingFavs;
    document.getElementById('favToggleBtn').style.background = showingFavs ? 'var(--gold)' : '';
    document.getElementById('favToggleBtn').style.color = showingFavs ? 'var(--bg)' : '';
    applyFilters();
  };

  window.toggleFav = (e) => {
    e.stopPropagation();
    const q = deck[currentIndex];
    if (favorites.includes(q.id)) {
      favorites = favorites.filter(id => id !== q.id);
    } else {
      favorites.push(q.id);
    }
    localStorage.setItem('ff_favs', JSON.stringify(favorites));
    updateUI();
  };

  function updateUI() {
    if (deck.length === 0) {
      qText.innerText = showingFavs ? "Du har ikke gemt nogen favoritter endnu." : "Ingen spørgsmål i denne kategori.";
      idLabel.innerText = "#--";
      catLabel.innerText = "-";
      return;
    }
    const q = deck[currentIndex];
    qText.innerText = q.text;
    catLabel.innerText = q.cat || "SAMTALE";
    idLabel.innerText = "#" + q.id;
    favIcon.innerText = favorites.includes(q.id) ? "♥" : "♡";
  }

  updateUI();
</script>
</body>
</html>
